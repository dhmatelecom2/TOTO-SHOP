<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOTO SHOP Admin</title><link rel="stylesheet" href="./admin.css"></head><body>
<div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><div class="admin-logo">T.</div><span class="eyebrow">TOTO SHOP CONTROL CENTER</span><h1>Admin Login</h1><p>আপনার অ্যাডমিন পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p><input type="password" name="password" placeholder="Admin password" required><button class="btn primary">নিরাপদে লগইন করুন</button><small id="loginError"></small><a href="/">← দোকানে ফিরে যান</a></form></div>
<div id="adminApp" class="admin-app" hidden><aside class="sidebar"><div class="side-brand"><span>T.</span><b>TOTO SHOP</b></div><div class="side-label">WORKSPACE</div><button class="nav active" data-tab="overview">▦ <span>ড্যাশবোর্ড</span></button><button class="nav" data-tab="products">◇ <span>পণ্য ম্যানেজ</span></button><button class="nav" data-tab="orders">▤ <span>অর্ডার ম্যানেজ</span></button><button class="nav" data-tab="settings">⚙ <span>সেটিংস</span></button><div class="side-bottom"><a href="/">↗ ওয়েবসাইট দেখুন</a><button id="logout">লগআউট</button></div></aside>
<main class="main"><header class="topbar"><div><small>CONTROL PANEL / <span id="currentSection">OVERVIEW</span></small><h2 id="pageTitle">ড্যাশবোর্ড</h2></div><span class="admin-pill">● ADMIN</span></header>
<section id="tab-overview" class="tab"><div class="stats" id="stats"></div><div class="panel"><div class="panel-head"><h3>সাম্প্রতিক অর্ডার</h3><button class="btn light" onclick="showTab('orders')">সব অর্ডার দেখুন →</button></div><div id="recentOrders"></div></div></section>
<section id="tab-products" class="tab" hidden><div class="panel"><div class="panel-head"><h3>পণ্য তালিকা</h3><button class="btn primary" id="addProduct">+ নতুন পণ্য</button></div><div id="productTable"></div></div><div class="panel" id="productEditor" hidden><h3 id="productFormTitle">নতুন পণ্য যোগ করুন</h3><form id="productForm" class="form-grid"><input type="hidden" name="id"><label>পণ্যের নাম<input name="name" required></label><label>ক্যাটাগরি<input name="category" placeholder="যেমন: ফ্যাশন"></label><label>দাম (৳)<input name="price" type="number" min="0" required></label><label>আগের দাম (৳)<input name="old_price" type="number" min="0"></label><label>স্টক<input name="stock" type="number" min="0" required></label><label>ছবির URL<input name="image_url" type="url" placeholder="https://..."></label><label class="wide">বিবরণ<textarea name="description"></textarea></label><label class="check"><input type="checkbox" name="active" checked> ওয়েবসাইটে দেখান</label><div class="wide actions"><button class="btn primary">সংরক্ষণ করুন</button><button type="button" class="btn light" id="cancelProduct">বাতিল</button></div></form></div></section>
<section id="tab-orders" class="tab" hidden><div class="panel"><div class="panel-head"><h3>সব অর্ডার</h3><button class="btn light" id="refreshOrders">↻ রিফ্রেশ</button></div><div id="orderTable"></div></div></section>
<section id="tab-settings" class="tab" hidden><form id="settingsForm"><div class="panel"><h3>দোকানের তথ্য</h3><div class="form-grid"><label>দোকানের নাম<input name="shop_name"></label><label>ট্যাগলাইন<input name="tagline"></label><label class="wide">Announcement bar<input name="announcement"></label><label>Hero title<input name="hero_title"></label><label>Hero subtitle<input name="hero_subtitle"></label><label>ডেলিভারি চার্জ (৳)<input name="delivery_charge" type="number" min="0"></label></div></div><div class="panel"><h3>পেমেন্ট সেটিংস</h3><div class="form-grid"><label>বিকাশ নম্বর<input name="bkash_number"></label><label>নগদ নম্বর<input name="nagad_number"></label><label class="check"><input type="checkbox" name="cod_enabled"> Cash on Delivery চালু</label><label class="check"><input type="checkbox" name="bkash_enabled"> বিকাশ চালু</label><label class="check"><input type="checkbox" name="nagad_enabled"> নগদ চালু</label></div></div><div class="panel"><h3>কাস্টমার সাপোর্ট</h3><div class="form-grid"><label>Telegram URL<input name="telegram_url" type="url"></label><label>WhatsApp URL<input name="whatsapp_url" type="url"></label></div></div><button class="btn primary">সেটিংস সংরক্ষণ করুন</button><span id="settingsMessage"></span></form></section>
</main></div><div id="toast" class="toast"></div><script src="./admin.js"></script></body></html>
